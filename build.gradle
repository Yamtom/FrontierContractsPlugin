plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

group = 'ua.grigo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // Paper API – not embedded (provided by server)
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'

    // SQLite JDBC – embedded via shadow jar
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

processResources {
    inputs.property 'version', version
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand 'version': version
    }
}

shadowJar {
    archiveBaseName = 'FrontierContracts'
    archiveClassifier = ''
    archiveVersion = version

    // Relocate SQLite to avoid conflicts
    relocate 'org.sqlite', 'ua.grigo.frontiercontracts.libs.sqlite'
    relocate 'org.xerial', 'ua.grigo.frontiercontracts.libs.xerial'

    minimize {
        // Keep SQLite service loader entry
        exclude(dependency('org.xerial:sqlite-jdbc'))
    }
}

assemble.dependsOn shadowJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
