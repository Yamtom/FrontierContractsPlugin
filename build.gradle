plugins {
    id 'java'
}

group = 'ua.grigo'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        name = 'placeholderapi'
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly files("${rootProject.projectDir}/../vault-1.5.4.jar")
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveClassifier = 'thin'
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a self-contained runtime jar.'
    archiveBaseName = 'FrontierContracts'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }

    from(sourceSets.main.output)
    dependsOn(configurations.runtimeClasspath)
    from({
        configurations.runtimeClasspath
            .findAll { it.name.endsWith('.jar') }
            .collect { zipTree(it) }
    })

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

tasks.register('copyRuntimeJar', Copy) {
    group = 'build'
    description = 'Copies the runtime jar to the project root for easy installation.'
    doNotTrackState("Project root contains unreadable Gradle metadata on Windows; plain copy is sufficient.")
    dependsOn(tasks.named('fatJar'))
    from(tasks.named('fatJar').flatMap { it.archiveFile })
    into(layout.projectDirectory)
    rename { 'FrontierContracts.jar' }
}

tasks.named('build') {
    dependsOn(tasks.named('fatJar'))
    finalizedBy(tasks.named('copyRuntimeJar'))
}

wrapper {
    gradleVersion = '8.11'
    distributionType = Wrapper.DistributionType.BIN
}
