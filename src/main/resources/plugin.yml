name: FrontierContracts
version: ${version}
main: ua.grigo.frontiercontracts.FrontierContractsPlugin
api-version: "26.1.2"
author: grigo
description: Physical settlement supply boards with public delivery tasks, GUI browsing, SQLite persistence, and reputation.
commands:
  contracts:
    description: Opens contract menus and manages physical settlement boards.
    usage: /contracts [active|submit|abandon <id>|admin <subcommand>]
    permission: frontiercontracts.use
    aliases: [fc, frontier]

permissions:
  frontier.use:
    description: Use Frontier Contracts menus and accepted-offer flows.
    default: true
  frontier.admin:
    description: Manage Frontier Contracts boards and data.
    default: op
  frontier.admin.board:
    description: Admin board commands specifically.
    default: op
